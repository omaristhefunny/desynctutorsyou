<!DOCTYPE html>
<html lang="en">
<head>
  <script src="s3-shim.js?v=30dc3699fc"></script>
<meta charset="UTF-8">
<script>
(function () {
  var BASE = window.__desyncBase || location.pathname.replace(/[^/]*$/, "");
  var page = null;
  try { page = sessionStorage.getItem("__desyncNext"); sessionStorage.removeItem("__desyncNext"); } catch (e) {}
  if (!page) { try { page = history.state && history.state.__desyncPage; } catch (e) {} }
  if (!page || page === "index.html" || /^[/.]|:/.test(page)) page = "main.html";
  function get(p) {
    try { var x = new XMLHttpRequest(); x.open("GET", BASE + p, false); x.send(); if (x.status === 200) return x.responseText; } catch (e) {}
    return null;
  }
  var html = get(page);
  if (html == null && page !== "main.html") { page = "main.html"; html = get(page); }
  try {
    var st = history.state && typeof history.state === "object" ? Object.assign({}, history.state) : {};
    st.__desyncPage = page;
    history.replaceState(st, "", location.href);
  } catch (e) {}
  window.__desyncPage = page;
  var dir = page.indexOf("/") >= 0 ? page.slice(0, page.lastIndexOf("/") + 1) : "";
  document.write((dir ? '<base href="' + BASE + dir + '">' : "") + (html || "<p>Could not load this page.</p>"));
})();
</script>
</head>
</html>
