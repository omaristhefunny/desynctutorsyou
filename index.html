  <script>
  /* early tab disguise: paints the title/icon before the page shows, then
     settings.js takes over and holds it. Default name is editable in settings. */
  (function () {
    var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
    var pick = get("tabCloak") || "disd";
    var name = get("desync_cloak_title");
    var logo = "/images/desynclogo.png";
    var sites = {
      quizlet: ["Your Sets | Quizlet", "https://quizlet.com/favicon.ico"],
      google: ["Google", "https://www.google.com/favicon.ico"],
      "google-classroom": ["Home | Google Classroom", "https://ssl.gstatic.com/classroom/favicon.png"],
      "google-docs": ["Google Docs", "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico"],
      "google-drive": ["Google Drive", "https://ssl.gstatic.com/docs/documents/images/icons/ic_menu_docs_new_48px.svg"],
      peardeck: ["Pear Deck", "https://cdn.peardeck.com/favicon.ico"],
      "khan-academy": ["Khan Academy", "https://www.khanacademy.org/favicon.ico"],
      wikipedia: ["Wikipedia", "https://en.wikipedia.org/favicon.ico"],
      youtube: ["YouTube", "https://www.youtube.com/favicon.ico"],
      outlook: ["Inbox - Outlook", "https://outlook.live.com/favicon.ico"],
      ixl: ["IXL | Math, Language Arts, Science, Social Studies, and Spanish", "https://www.ixl.com/favicon.ico"],
      classroom: ["Canvas", "https://www.instructure.com/favicon.ico"],
      "default": ["Apps | desync", "/images/onlylessons.png"]
    };
    var title, icon;
    if (pick === "disd") { title = name || "DISD | Information"; icon = logo; }
    else { var d = sites[pick] || ["DISD | Information", logo]; title = d[0]; icon = d[1]; }
    document.title = title;
    var links = document.querySelectorAll("link[rel~='icon'], link[rel~='shortcut']");
    for (var i = 0; i < links.length; i++) links[i].remove();
    var l = document.createElement("link");
    l.rel = "icon"; l.setAttribute("data-dz", ""); l.href = icon;
    document.head.appendChild(l);
  })();
  </script>
