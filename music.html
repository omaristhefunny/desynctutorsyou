<!DOCTYPE html>
<html lang="en">
<head>
  <script src="s3-shim.js?v=797cc5692c"></script>
  <meta charset="UTF-8">
  <script src="j/80a6fe7c39.js"></script>
  <script src="j/2c09fc8ac4.js"></script>
  <title>IXL | Math, Language Arts, Science, Social Studies, and Spanish</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <link id="favicon" rel="icon" href="images/onlylessons.png" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/ui.css?v=30">
  <link rel="stylesheet" href="css/page-music.css?v=43">
</head>
<body>
  <main class="ol-stage music">
    <aside id="libSide" class="lib-side" aria-label="Your library"></aside>
    <div class="music-main">
    <header class="music-head">
      <div class="music-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input type="text" id="musicSearch" class="music-search-input"
               placeholder="Search songs, artists…" autocomplete="off" aria-label="Search music">
      </div>
      <div class="music-settings" id="musicSettings">
        <button type="button" class="music-gear" id="musicGear" aria-label="Music settings" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <div class="music-pop" id="musicPop" hidden role="menu" aria-label="Music settings">
          <div class="music-pop-sec">
            <span class="music-pop-label">Source</span>
            <div class="music-source" id="musicSource" role="group" aria-label="Source">
              <button type="button" class="music-source-btn active" data-source="auto">Auto</button>
              <button type="button" class="music-source-btn" data-source="yt">YouTube</button>
              <button type="button" class="music-source-btn" data-source="sc">SoundCloud</button>
            </div>
          </div>
          <div class="music-pop-sec">
            <span class="music-pop-label">Equalizer</span>
            <div class="eq-chips" id="eqChips">
              <button type="button" class="eq-chip active" data-eq="flat">Flat</button>
              <button type="button" class="eq-chip" data-eq="bass">Bass</button>
              <button type="button" class="eq-chip" data-eq="vocal">Vocal</button>
              <button type="button" class="eq-chip" data-eq="treble">Treble</button>
              <button type="button" class="eq-chip" data-eq="rock">Rock</button>
              <button type="button" class="eq-chip" data-eq="pop">Pop</button>
              <button type="button" class="eq-chip" data-eq="lofi">Lo-Fi</button>
            </div>
          </div>
          <div class="music-pop-sec music-pop-row">
            <span class="music-pop-label">Auto-show lyrics</span>
            <button type="button" class="music-switch" id="autoLyrics" role="switch" aria-checked="false" aria-label="Auto-show lyrics"></button>
          </div>
        </div>
      </div>
    </header>

    <div id="musicStatus" class="music-status" hidden></div>
    <div id="musicBody" class="music-body"></div>
    </div>
  </main>
  <div class="lib-scrim" id="libScrim" hidden></div>

  <div id="player" class="player" hidden aria-label="Now playing">
    <div class="player-track">
      <img id="pThumb" class="player-thumb" alt="">
      <div class="player-meta">
        <span id="pTitle" class="player-title">—</span>
        <span id="pArtist" class="player-artist"></span>
      </div>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button id="pPrev" class="player-btn" type="button" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="pPlay" class="player-btn player-play" type="button" aria-label="Play/pause">
          <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button id="pNext" class="player-btn" type="button" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
        </button>
        <button id="pRepeat" class="player-btn player-repeat" type="button" aria-label="Repeat: off" title="Repeat: off">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
          <span class="repeat-one" aria-hidden="true">1</span>
        </button>
      </div>
      <div class="player-seek">
        <span id="pCur" class="player-time">0:00</span>
        <input id="pSeek" class="player-range" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <span id="pDur" class="player-time">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button id="pFav" class="player-btn player-fav" type="button" aria-label="Save to favorites">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>
        </svg>
      </button>
      <button id="pMini" class="player-btn player-mini" type="button" hidden aria-pressed="true"
        aria-label="Keep playing in a mini player when you leave this page" title="Mini player while browsing: on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="12" y="12" width="7" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="pLyrics" class="player-btn player-lyrics-btn" type="button" aria-label="Lyrics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <div class="player-volume">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5l4.5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        <input id="pVol" class="player-range player-vol" type="range" min="0" max="100" value="100" aria-label="Volume">
      </div>
    </div>
  </div>

  <aside id="lyricsPanel" class="lyrics-panel" hidden aria-label="Lyrics">
    <div class="lyrics-bg" aria-hidden="true"><div id="lyricsBgA" class="lyrics-bg-img"></div><div id="lyricsBgB" class="lyrics-bg-img"></div></div>
    <div class="lyrics-head" id="lyricsHead" title="Drag to move">
      <img id="lyricsArt" class="lyrics-art" alt="" hidden>
      <span class="lyrics-heading"><span id="lyricsTitle" class="lyrics-title">Lyrics</span><span id="lyricsArtist" class="lyrics-artist"></span></span>
      <button id="lyricsExpand" class="player-btn lyrics-expand" type="button" aria-label="Full screen lyrics" title="Full screen">
        <svg class="ic-grow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        <svg class="ic-shrink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>
      </button>
      <button id="lyricsClose" class="player-btn" type="button" aria-label="Close lyrics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="lyricsBody" class="lyrics-body"></div>
    <span class="lyrics-resize" data-corner="nw" aria-hidden="true"></span>
    <span class="lyrics-resize" data-corner="ne" aria-hidden="true"></span>
    <span class="lyrics-resize" data-corner="sw" aria-hidden="true"></span>
    <span class="lyrics-resize" data-corner="se" aria-hidden="true"></span>
  </aside>

  <div id="lyfs" class="lyfs" hidden role="dialog" aria-label="Lyrics">
    <div class="lyfs-bg" aria-hidden="true">
      <div class="lyfs-bg-img" id="lyfsBgA"></div>
      <div class="lyfs-bg-img" id="lyfsBgB"></div>
      <div class="lyfs-bg-shade"></div>
    </div>
    <header class="lyfs-top">
      <div class="lyfs-track">
        <img id="lyfsArt" class="lyfs-art" alt="">
        <div class="lyfs-meta"><div id="lyfsTitle" class="lyfs-title"></div><div id="lyfsArtist" class="lyfs-artist"></div></div>
      </div>
      <div class="lyfs-actions">
        <button id="lyfsFull" class="lyfs-chip" type="button" aria-label="Fill the screen" title="Fill the screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <button id="lyfsClose" class="lyfs-chip" type="button" aria-label="Close full screen lyrics" title="Close (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
    </header>
    <div id="lyfsLines" class="lyfs-lines"><div id="lyfsInner" class="lyfs-inner"></div></div>
    <footer class="lyfs-bottom">
      <div class="lyfs-seek">
        <div id="lyfsBar" class="lyfs-bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100"><div id="lyfsFill" class="lyfs-fill"></div></div>
        <span id="lyfsTime" class="lyfs-time">0:00 / 0:00</span>
      </div>
      <div class="lyfs-pill">
        <button id="lyfsFav" class="lyfs-btn lyfs-fav" type="button" aria-label="Save to favorites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg>
        </button>
        <button id="lyfsPrev" class="lyfs-btn" type="button" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
        </button>
        <button id="lyfsPlay" class="lyfs-btn lyfs-play" type="button" aria-label="Play or pause">
          <svg class="lyfs-ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
          <svg class="lyfs-ic-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
        </button>
        <button id="lyfsNext" class="lyfs-btn" type="button" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg>
        </button>
        <button id="lyfsRepeat" class="lyfs-btn lyfs-repeat" type="button" aria-label="Repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
          <span class="lyfs-one" aria-hidden="true">1</span>
        </button>
      </div>
    </footer>
  </div>

  <div class="modal-overlay" id="favModal">
    <div class="ol-panel modal">
      <h2 class="ol-h2">Save song to…</h2>
      <p class="ol-sub" id="favModalTrack"></p>

      <div class="fav-pick" id="favPick"></div>

      <div class="fav-new">
        <input class="ol-input" id="newPlaylistName" maxlength="60" placeholder="New playlist name" autocomplete="off">
        <button class="ol-btn" id="createPlaylistBtn" type="button">Create</button>
      </div>

      <p class="ol-sub hidden" id="favModalError" style="color:var(--danger);font-size:13px;"></p>

      <div class="modal-actions">
        <button class="ol-btn" id="favCancel" type="button">Cancel</button>
        <button class="ol-btn ol-btn-primary" id="favUncategorized" type="button">Save without a playlist</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="newPlModal">
    <div class="ol-panel modal np-modal">
      <h2 class="ol-h2">Create a playlist</h2>
      <p class="ol-sub">Give your playlist a name.</p>
      <input class="ol-input" id="npName" maxlength="60" placeholder="Playlist name" autocomplete="off">
      <div class="np-label">Start with</div>
      <div class="np-options" id="npOptions"></div>
      <input class="ol-input hidden" id="npArtist" maxlength="80" placeholder="Artist or song, e.g. Drake" autocomplete="off">
      <div class="np-label np-count-label">How many songs <span id="npCountVal">15</span></div>
      <input type="range" id="npCount" class="player-range np-count" min="5" max="30" step="5" value="15">
      <p class="ol-sub hidden" id="npError" style="color:var(--danger);font-size:13px;"></p>
      <div class="modal-actions">
        <button class="ol-btn" id="npCancel" type="button">Cancel</button>
        <button class="ol-btn ol-btn-primary" id="npCreate" type="button">Create</button>
      </div>
    </div>
  </div>
  <audio id="audio" preload="none" crossorigin="anonymous"></audio>

  <script src="j/282bb34338.js"></script>
  <script src="j/91259d2b9b.js"></script>
  <script src="j/8e6f525625.js"></script>
  <script src="j/76dc47a7d8.js"></script>
  <script src="j/f7428f82b1.js"></script>
  <script type="module" src="j/43fb08df7b.js"></script>
  <script src="j/3c7d1ff9e2.js"></script>
</body>
</html>
