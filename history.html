<!DOCTYPE html>
<html lang="en">
<head>
  <script src="s3-shim.js?v=0816501433"></script>
  <meta charset="UTF-8">

  <script src="j/31afd2443c.js"></script>
  <script src="j/2c09fc8ac4.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IXL</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="images/ixl.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/ui.css?v=26">

  <link rel="stylesheet" href="css/education.css?v=10">
  <link rel="stylesheet" href="css/education-enhanced.css?v=7">
</head>
<body>
  <main class="ol-stage">
    <div class="education-head">
      <div class="education-head-top">
        <div>
          <h1 class="ol-h1">Education</h1>
        </div>
        <div class="per-row" id="perRow" role="group" aria-label="Items per row">
          <span class="per-row-label">Per row</span>
          <button type="button" data-cols="5" aria-pressed="false">5</button>
          <button type="button" data-cols="6" aria-pressed="false">6</button>
          <button type="button" data-cols="7" aria-pressed="false">7</button>
          <button type="button" data-cols="8" aria-pressed="false">8</button>
        </div>
      </div>


      <div class="education-tools">
        <div class="education-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" class="ol-input" id="searchBar" placeholder="Search education" autocomplete="off" aria-label="Search education">
        </div>
        <select class="education-sort" id="sortBy" aria-label="Sort education">
          <option value="name">A–Z</option>
          <option value="id">Newest</option>
        </select>
        <span class="education-count" id="educationCount"></span>
      </div>
    </div>

    <section class="education-section popular" id="popSection" hidden aria-label="Popular education">
      <div class="popular-head">
        <h2>Popular education</h2>
      </div>
      <div class="popular-viewport">
        <div class="popular-track" id="popTrack"></div>
      </div>
    </section>

    <section class="education-section" id="favSection" hidden>
      <h2>Favorites <span id="favCount"></span></h2>
      <div class="education-grid" id="favGrid"></div>
    </section>

    <section class="education-section">
      <h2 id="allHeading">All education</h2>
      <div class="education-grid" id="allGrid"></div>
      <div class="education-status" id="status">Loading education…</div>
    </section>
  </main>

  <div id="player" aria-hidden="true">
    <div class="player-bar">
      <h2 id="playerTitle"></h2>
      <span id="playerSync" class="player-sync" hidden></span>
      <div class="player-actions">
        <button class="ol-btn ol-btn-sm player-sync-btn" id="playerSyncBtn" type="button" hidden
                title="Save your progress to your account now">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2"/><path d="M21 4v5h-5M3 20v-5h5"/></svg>
          <span>Sync</span>
        </button>
        <button class="ol-btn ol-btn-sm player-switch" id="playerSwitch" type="button" hidden title="Play this game from the other provider">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>
          <span>Switch server</span>
        </button>
        <button class="ol-btn ol-btn-sm" id="playerFull" type="button">Fullscreen</button>
        <button class="ol-btn ol-btn-sm ol-btn-danger" id="playerClose" type="button">Close</button>
      </div>
    </div>
    <div class="player-hint" id="playerHint" hidden role="status">
      <span class="ph-text"></span>
      <button class="ph-switch" type="button">Switch server</button>
      <button class="ph-close" type="button" aria-label="Dismiss">✕</button>
    </div>
    <iframe id="playerFrame" allowfullscreen
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock"></iframe>
  </div>

  <script src="j/282bb34338.js"></script>
  <script src="j/8159277151.js"></script>
  <script src="j/8e6f525625.js"></script>
  <script src="j/76dc47a7d8.js"></script>

  <script src="j/7497c20144.js"></script>
  <script src="j/305be9adb4.js"></script>
  <script src="j/ab376523f0.js"></script>
  <script src="j/042c97a86e.js"></script>
  <script type="module" src="j/43fb08df7b.js"></script>
</body>
</html>
