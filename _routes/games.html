<!DOCTYPE html>
<html lang="en">
<head>
  <script src="s3-shim.js?v=836f911196"></script>
  <meta charset="UTF-8">

  <script src="j/8fb825f774.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IXL | Math, Language Arts, Science, Social Studies, and Spanish</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="images/ixl.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/ui.css?v=16">

  <link rel="stylesheet" href="css/games.css?v=9">
  <link rel="stylesheet" href="css/games-enhanced.css?v=5">
</head>
<body>
  <main class="ol-stage">
    <div class="games-head">
      <div class="games-head-top">
        <div>
          <h1 class="ol-h1">Games</h1>
          <p class="ol-sub">Pick a game and it starts streaming. Nothing to install.</p>
        </div>
        <div class="per-row" id="perRow" role="group" aria-label="Games per row">
          <span class="per-row-label">Per row</span>
          <button type="button" data-cols="5" aria-pressed="false">5</button>
          <button type="button" data-cols="6" aria-pressed="false">6</button>
          <button type="button" data-cols="7" aria-pressed="false">7</button>
          <button type="button" data-cols="8" aria-pressed="false">8</button>
        </div>
      </div>

      <div class="lib-switch" role="tablist" aria-label="Game library">
        <a class="lib-tab active" data-href="g" role="tab" tabindex="0" aria-selected="true">Games</a>
        <a class="lib-tab" data-href="gnmath" role="tab" tabindex="0" aria-selected="false">GN-Math Games</a>
      </div>

      <div class="games-tools">
        <div class="games-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" class="ol-input" id="searchBar" placeholder="Search games" autocomplete="off" aria-label="Search games">
        </div>
        <select class="games-sort" id="sortBy" aria-label="Sort games">
          <option value="name">A–Z</option>
          <option value="id">Newest</option>
        </select>
        <span class="games-count" id="gamesCount"></span>
      </div>
    </div>

    <section class="games-section popular" id="popSection" hidden aria-label="Popular games">
      <div class="popular-head">
        <h2>Popular games</h2>
      </div>
      <div class="popular-viewport">
        <div class="popular-track" id="popTrack"></div>
      </div>
    </section>

    <section class="games-section" id="favSection" hidden>
      <h2>Favorites <span id="favCount"></span></h2>
      <div class="games-grid" id="favGrid"></div>
    </section>

    <section class="games-section">
      <h2 id="allHeading">All games</h2>
      <div class="games-grid" id="allGrid"></div>
      <div class="games-status" id="status">Loading games…</div>
      <a class="more-cta" id="moreCta" href="gnmath" hidden>
        <svg class="more-cta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
        <span><strong>Can't find the game you're looking for?</strong> Click me for more options with our different provider.</span>
        <svg class="more-cta-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </section>
  </main>

  <div id="player" aria-hidden="true">
    <div class="player-bar">
      <h2 id="playerTitle"></h2>
      <span id="playerSync" class="player-sync" hidden></span>
      <div class="player-actions">
        <button class="ol-btn ol-btn-sm player-sync-btn" id="playerSyncBtn" type="button" hidden
                title="Save this game's progress to your account now">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2"/><path d="M21 4v5h-5M3 20v-5h5"/></svg>
          <span>Sync</span>
        </button>
        <button class="ol-btn ol-btn-sm" id="playerFull" type="button">Fullscreen</button>
        <button class="ol-btn ol-btn-sm ol-btn-danger" id="playerClose" type="button">Close</button>
      </div>
    </div>
    <iframe id="playerFrame" allowfullscreen
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock"></iframe>
  </div>

  <script src="j/a379560dfa.js"></script>
  <script src="j/dd99118da8.js"></script>
  <script src="j/e4b3ee20bf.js"></script>
  <script src="j/8837362b8d.js"></script>

  <script src="j/441c7c5f8b.js"></script>
  <script src="j/9036bc5839.js"></script>
  <script src="j/10edcd3ec2.js"></script>
  <script src="j/e336675a19.js"></script>
  <script type="module" src="j/29afb96059.js"></script>
</body>
</html>
