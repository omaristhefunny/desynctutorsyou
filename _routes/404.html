<!DOCTYPE html>
<html lang="en">
<head>
  <script src="s3-shim.js?v=99b0df622b"></script>
  <meta charset="UTF-8">

  <script src="j/80a6fe7c39.js"></script>
  <script src="j/2c09fc8ac4.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IXL | Math, Language Arts, Science, Social Studies, and Spanish</title>

  <link rel="stylesheet" href="css/ui.css?v=30">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/page-404.css?v=3">
</head>
<body>
  <div class="nf-bg" aria-hidden="true"></div>

  <main class="nf">
    <p class="nf-tag"><span class="nf-pulse" aria-hidden="true"></span>Error 404 · Page not found</p>

    <div class="nf-code" aria-hidden="true">
      <span>4</span><span class="nf-zero">0</span><span>4</span>
    </div>

    <h1 class="nf-title">This page doesn't exist</h1>
    <p class="nf-desc">The link may be old or mistyped. If a site you were browsing sent you here, go back and try again.</p>

    <code class="nf-path" id="nfPath" hidden></code>

    <div class="nf-actions">
      <button type="button" class="ol-btn ol-btn-primary nf-btn" id="nfBack">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        Go back
      </button>
      <button type="button" class="ol-btn nf-btn" data-go="/main.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>
        Home
      </button>
    </div>

    <nav class="nf-links" aria-label="Popular pages">
      <span class="nf-links-label">Or jump to</span>
      <button type="button" data-go="/g">Education</button>
      <button type="button" data-go="/movies">Movies</button>
      <button type="button" data-go="/music.html">Music</button>
      <button type="button" data-go="/studying.html">AI</button>
    </nav>
  </main>

  <script>
    (function () {
      var path = document.getElementById("nfPath");
      var p = location.pathname + location.search;
      if (p && p !== "/" && !/\/404(\.html)?$/.test(location.pathname)) {
        path.textContent = p.length > 60 ? p.slice(0, 57) + "…" : p;
        path.hidden = false;
      }
      // Buttons rather than links, so the browser doesn't show the address
      // in the corner on hover.
      // On the S3 copies the site lives under a base path (window.__desyncBase).
      function go(p) { location.href = (window.__desyncBase || "/") + p.replace(/^\//, ""); }
      document.querySelectorAll("[data-go]").forEach(function (b) {
        b.addEventListener("click", function () { go(b.getAttribute("data-go")); });
      });
      document.getElementById("nfBack").addEventListener("click", function () {
        if (history.length > 1) history.back();
        else go("/main.html");
      });
    })();
  </script>

  <script src="j/73bd12a401.js"></script>
  <script src="j/8e6f525625.js"></script>

  <script type="module" src="j/43fb08df7b.js"></script>
</body>
</html>
