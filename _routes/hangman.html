<!DOCTYPE html>
<html lang="en">
<head>
  <script src="s3-shim.js?v=06d53f1e33"></script>
  <meta charset="UTF-8">

  <script src="j/757c01fc07.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IXL | Math, Language Arts, Science, Social Studies, and Spanish</title>
  <meta name="theme-color" content="#000000">
  <link id="favicon" rel="icon" href="images/onlylessons.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/ui.css?v=16">
  <link rel="stylesheet" href="css/page-hangman.css">
</head>
<body>
  <main class="ol-stage">
    <div class="hm-wrap">
      <header class="hm-head">
        <h1 class="ol-h1">Hangman</h1>
        <p class="ol-sub" id="hmCategory">Guess the word before the drawing finishes.</p>
      </header>

      <div class="hm-game">
        <div class="hm-stage">
          <svg class="hm-gallows" viewBox="0 0 200 220" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
            <line x1="20" y1="210" x2="120" y2="210"/>
            <line x1="50" y1="210" x2="50" y2="20"/>
            <line x1="50" y1="20" x2="140" y2="20"/>
            <line x1="140" y1="20" x2="140" y2="45"/>
            <circle class="hm-part" data-part="0" cx="140" cy="63" r="18"/>
            <line class="hm-part" data-part="1" x1="140" y1="81" x2="140" y2="140"/>
            <line class="hm-part" data-part="2" x1="140" y1="95" x2="115" y2="120"/>
            <line class="hm-part" data-part="3" x1="140" y1="95" x2="165" y2="120"/>
            <line class="hm-part" data-part="4" x1="140" y1="140" x2="118" y2="175"/>
            <line class="hm-part" data-part="5" x1="140" y1="140" x2="162" y2="175"/>
          </svg>
          <div class="hm-lives" id="hmLives"></div>
        </div>

        <div class="hm-play">
          <div class="hm-word" id="hmWord"></div>
          <p class="hm-status" id="hmStatus"></p>
          <div class="hm-keys" id="hmKeys"></div>
          <button class="ol-btn ol-btn-primary hm-new" id="hmNew" type="button">New word</button>
        </div>
      </div>
    </div>
  </main>

  <script src="j/5f754c11cf.js"></script>
  <script src="j/80c01807f7.js"></script>
  <script src="j/8837362b8d.js"></script>
  <script src="j/7aa3ed382d.js"></script>
  <script src="j/e336675a19.js"></script>
  <script type="module" src="j/29afb96059.js"></script>
</body>
</html>
