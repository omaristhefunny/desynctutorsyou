<!doctype html>
<html lang="en">
  <head>
  <script src="s3-shim.js?v=5a41273a41"></script>
    <meta charset="UTF-8" />
  <script src="j/6b6ab3d4fb.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat | desync</title>
    <link rel="icon" href="images/onlylessons.png" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="css/ui.css?v=8">
    <link rel="stylesheet" href="css/page-studying.css?v=8">
</head>
  <body>
    <main class="ai-shell ol-stage">

      <aside class="ai-rail" id="aiRail">
        <div class="ai-rail-head">
          <button class="ai-new" type="button" id="aiNewChat" title="New chat" aria-label="New chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>New chat</span>
          </button>
        </div>
        <div class="ai-rail-list" id="aiChatList"></div>

        <div class="ai-usage" id="aiUsage" hidden>
          <div class="ai-usage-head">
            <span class="ai-usage-label">Prompts left today</span>
            <span class="ai-usage-count" id="aiUsageCount">—</span>
          </div>
          <div class="ai-usage-bar" aria-hidden="true"><span class="ai-usage-fill" id="aiUsageFill"></span></div>
          <p class="ai-usage-plan" id="aiUsagePlan"></p>
          <a class="ai-usage-upgrade" id="aiUsageUpgrade" href="account.html">Get more prompts</a>
        </div>
      </aside>

      <section class="ai-main" id="aiMain">
        <header class="chat-header">
          <button class="ai-rail-toggle" type="button" id="aiRailToggle"
                  aria-label="Show chats" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
          <span class="chat-title" id="aiChatTitle">New chat</span>
        </header>

        <div class="ai-gate" id="aiGate" hidden>
          <div class="ai-gate-card">
            <div class="ai-gate-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="10.5" width="16" height="10" rx="2"/>
                <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
              </svg>
            </div>
            <h2>Sign in to use the AI</h2>
            <p>Your prompts are counted against your account, so the AI needs one.
               Signing up is free and comes with <strong id="aiGateFree">25</strong> prompts a day.</p>
            <div class="ai-gate-actions">
              <a class="ol-btn ol-btn-primary" href="account.html">Sign in or sign up</a>
              <a class="ol-btn" href="account.html#plans">See plans</a>
            </div>
            <ul class="ai-gate-models" id="aiGateModels"></ul>
          </div>
        </div>

        <div class="chat-messages" id="chatMessages">
          <div class="welcome-message">
            <h2>The Stage is Yours</h2>
          </div>
        </div>

        <div class="chat-input-area">
          <div class="chat-input-wrapper">
            <div class="image-preview" id="imagePreview" style="display: none;">
              <img id="previewImg" alt="Upload preview">
              <button type="button" class="remove-img" onclick="removeImage()" aria-label="Remove image">×</button>
            </div>
            <div class="composer-row">
              <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
              <button type="button" class="attach-btn" onclick="document.getElementById('imageInput').click()" title="Add an image" aria-label="Add an image">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>
              </button>
              <textarea class="chat-input" id="chatInput" placeholder="Ask anything…" rows="1"></textarea>
              <div class="model-picker" id="modelPicker">
                <button class="model-trigger" type="button" id="modelTrigger"
                        aria-haspopup="listbox" aria-expanded="false" aria-label="Model">
                  <span class="model-trigger-name" id="modelTriggerName">Loading…</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 9l6 6 6-6"/>
                  </svg>
                </button>
                <div class="model-menu" id="modelMenu" role="listbox" hidden></div>
              </div>
              <button class="send-btn" id="sendBtn" aria-label="Send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                <span>Send</span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

  <script src="j/189d27dcf1.js"></script>
  <script src="j/e9d2c68652.js"></script>
  <script src="j/b5e4ce1605.js"></script>
  <script src="j/2eb64b0d41.js"></script>

  <script src="j/055642f055.js"></script>
  <script src="j/8837362b8d.js"></script>
  <script src="j/5ddb9491ec.js"></script>
  <script src="j/466cad5483.js"></script>
  <script type="module" src="j/5ee1141a23.js"></script>
</body>
</html>
